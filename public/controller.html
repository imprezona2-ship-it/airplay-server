<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AirPlay · Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<style>
  :root{--bg:#0a0a12;--panel:#13131f;--ink:#f4f4ff;--dim:#6b6b8a;--accent:#6bff95;--fire:#ff4d6d}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{font-family:'Bricolage Grotesque',sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
  .top{padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff10;flex-shrink:0;position:relative;z-index:5;background:var(--bg)}
  .logo{font-weight:800;font-size:18px}.logo span{color:var(--accent)}
  .you{font-family:'Space Mono',monospace;font-size:12px;color:var(--dim)}

  /* JOIN */
  .join{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:12px}
  .join input{width:100%;max-width:300px;text-align:center;font-family:'Space Mono',monospace;font-size:30px;letter-spacing:.2em;text-transform:uppercase;background:var(--panel);border:1px solid #ffffff20;border-radius:16px;padding:18px;color:var(--ink)}
  .join input.name{font-size:18px;letter-spacing:0}
  #clearBtn{background:transparent;border:1px solid #ffffff20;color:var(--dim);border-radius:12px;padding:10px 16px;font-family:'Space Mono',monospace;font-size:13px}
  .join button{width:100%;max-width:300px;background:var(--accent);color:#04210f;border:none;border-radius:16px;padding:18px;font-family:inherit;font-weight:800;font-size:18px}
  .err{color:#ff4d6d;font-size:14px;min-height:18px}

  /* sensibilidad arriba */
  .ctrl-top{display:none;align-items:center;gap:8px;flex:1;justify-content:center}
  .ctrl-top.show{display:flex}
  .sens-lbl{font-family:'Space Mono',monospace;font-size:12px;color:var(--dim);white-space:nowrap}
  .sens-lbl b{color:var(--accent)}
  #sensSlider{width:100%;max-width:200px;-webkit-appearance:none;appearance:none;height:8px;border-radius:5px;background:#ffffff18;outline:none}
  #sensSlider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid #04210f}
  #sensSlider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid #04210f}

  /* GAMEPAD: stick a la izq, botón disparo a la der (centrados verticalmente) */
  .pad{flex:1;display:none;flex-direction:row;align-items:center;justify-content:space-between;padding:20px 30px;gap:16px}
  .pad.active{display:flex}
  .side{flex:1;display:flex;align-items:center;justify-content:center;position:relative}

  /* Joystick */
  .stick-base{position:relative;width:min(40vw,200px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 50% 38%, #20202f 0%, #14141e 55%, #0a0a12 100%);
    border:1px solid #ffffff10;box-shadow:inset 0 6px 26px #000000aa, inset 0 -3px 10px #ffffff08, 0 4px 14px #00000060}
  .stick-base::before{content:"";position:absolute;inset:14%;border-radius:50%;border:2px dashed #ffffff0e}
  .stick-knob{position:absolute;top:50%;left:50%;width:46%;aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 38% 30%, #6a6a92 0%, #3a3a55 40%, #20202f 75%, #15151f 100%);
    border:1px solid #ffffff22;transform:translate(-50%,-50%);
    box-shadow:0 8px 22px #000000aa, inset 0 3px 8px #ffffff30, inset 0 -6px 12px #00000080;transition:background .1s}
  .stick-knob.holding{background:radial-gradient(circle at 38% 30%, #8585b8 0%, #505078 38%, #2a2a40 78%, #1c1c2a 100%);box-shadow:0 10px 26px #000000cc, inset 0 3px 10px #ffffff44, 0 0 22px #6bff9533}

  /* Botón grande de disparo */
  .fire-btn{width:min(38vw,170px);aspect-ratio:1;border-radius:50%;border:3px solid var(--fire);
    background:radial-gradient(circle at 40% 32%, #3a1620, #1a0a10);color:var(--fire);
    font-family:inherit;font-weight:800;font-size:24px;letter-spacing:.05em;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px #00000090, inset 0 2px 6px #ffffff18, 0 0 24px #ff4d6d22;
    transition:transform .07s,filter .07s}
  .fire-btn:active,.fire-btn.down{transform:scale(.92);filter:brightness(1.5);box-shadow:0 2px 8px #00000090, inset 0 3px 10px #00000080,0 0 30px #ff4d6d55}

  .banner{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--dim);font-family:'Space Mono',monospace;text-align:center;width:90%;background:#0a0a12cc;padding:5px 10px;border-radius:10px}

  /* menú overlay */
  .menu-overlay{position:absolute;inset:0;background:#0a0a12ee;display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
  .menu-overlay.show{display:flex}
  .menu-card{background:var(--panel);border:1px solid #ffffff20;border-radius:20px;padding:28px 24px;text-align:center;max-width:340px}
  .menu-card h3{font-size:22px;font-weight:800;margin-bottom:8px}
  .menu-card p{color:var(--dim);font-size:14px;margin-bottom:16px;line-height:1.5}
  button.menu-opt{width:100%;display:flex;align-items:center;gap:12px;justify-content:center;background:#ffffff0a;border:1px solid #ffffff20;color:var(--ink);border-radius:12px;padding:14px;margin-bottom:10px;font-weight:700;font-size:16px;font-family:inherit}
  button.menu-opt:active{transform:scale(.96);background:#ffffff18}
  .menu-opt .k{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;border:2px solid;flex-shrink:0}
  .menu-opt .kx{color:#4dd0ff;border-color:#4dd0ff}
  .menu-opt .ko{color:#ff4d6d;border-color:#ff4d6d}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="top">
  <div class="logo">Air<span>Play</span></div>
  <div class="ctrl-top" id="ctrlTop">
    <span class="sens-lbl">Sens <b id="sensVal">5</b></span>
    <input type="range" id="sensSlider" min="1" max="10" value="5" step="1" />
  </div>
  <div class="you" id="you"></div>
</div>

<!-- JOIN -->
<div class="join" id="joinScreen">
  <input id="codeInput" maxlength="4" placeholder="CÓDIGO" autocomplete="off" autocapitalize="characters" inputmode="text" />
  <button id="clearBtn" type="button">Borrar código</button>
  <input id="nameInput" class="name" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
  <button id="joinBtn">Unirse</button>
  <div class="err" id="err"></div>
</div>

<!-- GAMEPAD -->
<div class="pad" id="pad">
  <div class="banner" id="banner">Conectado · mirá la tele</div>
  <div class="menu-overlay" id="menuOverlay"><div class="menu-card" id="menuCard"></div></div>
  <div class="side">
    <div class="stick-base" id="stickBase"><div class="stick-knob" id="stickKnob"></div></div>
  </div>
  <div class="side">
    <button class="fire-btn" id="fireBtn">DISPARAR</button>
  </div>
</div>

<script>
  const socket = io();
  const params = new URLSearchParams(location.search);
  let myColor = null;

  const codeInput = document.getElementById("codeInput");
  if (params.get("code")) codeInput.value = params.get("code").toUpperCase();
  document.getElementById("clearBtn").onclick = () => { codeInput.value=""; codeInput.focus(); document.getElementById("err").textContent=""; };
  codeInput.addEventListener("input", () => { codeInput.value = codeInput.value.toUpperCase(); });

  document.getElementById("joinBtn").onclick = () => {
    const code = codeInput.value.trim().toUpperCase();
    const name = document.getElementById("nameInput").value.trim() || "Jugador";
    if (code.length < 4) { document.getElementById("err").textContent = "Código incompleto"; return; }
    socket.emit("player:join", { code, name });
  };
  socket.on("player:error", ({ message }) => { document.getElementById("err").textContent = message; });

  socket.on("player:joined", ({ color }) => {
    myColor = color;
    document.getElementById("joinScreen").classList.add("hidden");
    document.getElementById("pad").classList.add("active");
    document.getElementById("you").textContent = "● conectado";
    document.getElementById("you").style.color = color;
    document.getElementById("ctrlTop").classList.add("show");
    sendSens();
  });

  /* SENSIBILIDAD */
  const sensSlider = document.getElementById("sensSlider");
  function sendSens(){
    const v = parseInt(sensSlider.value,10);
    document.getElementById("sensVal").textContent = v;
    socket.emit("player:input", { type:"sens", value:v });
  }
  sensSlider.addEventListener("input", sendSens);

  /* JOYSTICK */
  const base = document.getElementById("stickBase");
  const knob = document.getElementById("stickKnob");
  let activeTouchId = null;
  let curX = 0, curY = 0, prevX = 0, prevY = 0;

  function axisLoop(){
    if (curX !== 0 || curY !== 0 || prevX !== 0 || prevY !== 0){
      socket.emit("player:input", { type:"axis", x:+curX.toFixed(3), y:+curY.toFixed(3) });
      prevX = curX; prevY = curY;
    }
    requestAnimationFrame(axisLoop);
  }
  requestAnimationFrame(axisLoop);

  function moveStick(clientX, clientY){
    const r = base.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    let dx = clientX-cx, dy = clientY-cy;
    const max = r.width/2, dist = Math.hypot(dx,dy);
    if (dist>max){ dx=dx/dist*max; dy=dy/dist*max; }
    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    curX = dx/max; curY = dy/max;
  }
  function resetStick(){ knob.style.transform="translate(-50%,-50%)"; knob.classList.remove("holding"); curX=0; curY=0; }

  base.addEventListener("touchstart",(e)=>{ const t=e.changedTouches[0]; activeTouchId=t.identifier; knob.classList.add("holding"); moveStick(t.clientX,t.clientY); },{passive:true});
  base.addEventListener("touchmove",(e)=>{ for(const t of e.changedTouches) if(t.identifier===activeTouchId) moveStick(t.clientX,t.clientY); },{passive:true});
  base.addEventListener("touchend",(e)=>{ for(const t of e.changedTouches) if(t.identifier===activeTouchId){ activeTouchId=null; resetStick(); } },{passive:true});
  let mouseDown=false;
  base.addEventListener("mousedown",(e)=>{ mouseDown=true; knob.classList.add("holding"); moveStick(e.clientX,e.clientY); });
  window.addEventListener("mousemove",(e)=>{ if(mouseDown) moveStick(e.clientX,e.clientY); });
  window.addEventListener("mouseup",()=>{ if(mouseDown){ mouseDown=false; resetStick(); } });

  /* BOTÓN DE DISPARO (manda 'cross', que es lo que el juego usa para disparar) */
  const fireBtn = document.getElementById("fireBtn");
  const firePress = (e)=>{ e.preventDefault(); fireBtn.classList.add("down"); socket.emit("player:input",{type:"button",button:"cross",state:"down"}); };
  const fireRelease = (e)=>{ e.preventDefault(); fireBtn.classList.remove("down"); socket.emit("player:input",{type:"button",button:"cross",state:"up"}); };
  fireBtn.addEventListener("touchstart", firePress, {passive:false});
  fireBtn.addEventListener("touchend", fireRelease, {passive:false});
  fireBtn.addEventListener("mousedown", firePress);
  fireBtn.addEventListener("mouseup", fireRelease);

  /* MENÚ (start / game over) controlado por el jugador 1 */
  function wireMenuButtons(){
    document.querySelectorAll(".menu-opt.tap").forEach(b=>{
      const act=b.dataset.act;
      const fire=(e)=>{ e.preventDefault(); e.stopPropagation();
        socket.emit("player:input",{type:"button",button:act,state:"down"});
        socket.emit("player:input",{type:"button",button:act,state:"up"}); };
      b.addEventListener("touchstart",fire,{passive:false});
      b.addEventListener("click",fire);
    });
  }
  socket.on("controller:message",(msg)=>{
    if (msg.type==="config"){ if(msg.banner) document.getElementById("banner").textContent=msg.banner; }
    if (msg.type==="banner") document.getElementById("banner").textContent=msg.text;
    if (msg.type==="menu"){
      const ov=document.getElementById("menuOverlay"), card=document.getElementById("menuCard");
      if (msg.kind==="none"){ ov.classList.remove("show"); }
      else if (msg.kind==="start"){
        card.innerHTML=`<h3>¡Todo listo!</h3><p>Sos el jugador que controla el juego.</p>
          <button class="menu-opt tap" data-act="cross"><span class="k kx">✕</span> Empezar a jugar</button>`;
        wireMenuButtons(); ov.classList.add("show");
      } else if (msg.kind==="end"){
        card.innerHTML=`<h3>Game Over</h3><p>Elegí qué hacer:</p>
          <button class="menu-opt tap" data-act="cross"><span class="k kx">✕</span> Jugar de nuevo</button>
          <button class="menu-opt tap" data-act="circle"><span class="k ko">○</span> Salir al inicio</button>`;
        wireMenuButtons(); ov.classList.add("show");
      }
    }
    if (msg.type==="config"){ document.getElementById("menuOverlay").classList.remove("show"); }
    if (msg.type==="room_closed"){
      document.getElementById("pad").classList.remove("active");
      document.getElementById("joinScreen").classList.remove("hidden");
      document.getElementById("err").textContent="La pantalla cerró la sala";
    }
  });
</script>
</body>
</html>
