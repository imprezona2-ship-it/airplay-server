<!DOCTYPE html>
<html lang="es-ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <title>My project (1)</title>
  <style>
    html,body{margin:0;padding:0;background:#0a0a12;height:100%;overflow:hidden}
    #unity-container{width:100%;height:100%;position:absolute}
    #unity-canvas{width:100%;height:100%;display:block}
    #airplay-status{position:absolute;top:10px;left:10px;z-index:5;
      font-family:monospace;font-size:13px;color:#6bff95;background:#0a0a12cc;
      padding:6px 12px;border-radius:8px}
    #airplay-code{font-size:18px;font-weight:bold;letter-spacing:2px}
    #unity-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      color:#6bff95;font-family:monospace;font-size:18px}
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading">Cargando… <span id="unity-progress">0%</span></div>
  </div>
  <div id="airplay-status">Sala: <span id="airplay-code">····</span> · <span id="airplay-players">0</span> jugadores</div>

  <!-- Socket.io (mismo que usa tu server) -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <script>
    // ===================================================================
    //  PUENTE AIRPLAY: conecta el server Socket.io con el juego Unity
    // ===================================================================
    // IMPORTANTE: poné acá la URL de tu server. En desarrollo, tu IP local.
    // En producción, la URL pública de tu server.
    const AIRPLAY_SERVER = "https://airplay-server-production.up.railway.app";

    let unityInstance = null;
    let targetObject = window.__airplayTarget || "AirPlay"; // GameObject que recibe en Unity
    let playerOrder = [];   // ids en orden de llegada (slot)

    // Unity (C#) registra a qué GameObject mandarle los mensajes
    window.AirPlaySetTarget = function (name) { targetObject = name; };

    // helper: mandar un mensaje a Unity (si ya cargó)
    function toUnity(method, payload) {
      if (unityInstance) unityInstance.SendMessage(targetObject, method, payload);
    }

    // Unity nos habla a nosotros (config de botones, banners) -> reenviar a los celus
    window.AirPlayFromUnity = function (dataStr) {
      try {
        const data = JSON.parse(dataStr);
        // si trae "to" mandamos a uno; si no, a todos
        socket.emit("screen:message", { to: data.to || null, data });
      } catch (e) { console.error("AirPlayFromUnity parse error", e); }
    };

    // ---- Socket.io: la pantalla crea la sala, igual que tu index.html ----
    const socket = io(AIRPLAY_SERVER, { transports: ["websocket"] });

    socket.emit("screen:create");
    socket.on("screen:created", ({ code }) => {
      document.getElementById("airplay-code").textContent = code;
    });

    socket.on("screen:players", (players) => {
      document.getElementById("airplay-players").textContent = players.length;
      const prev = new Set(playerOrder);
      playerOrder = players.map(p => p.id);
      // avisar a Unity de cada jugador (con su slot por orden de llegada)
      players.forEach((p, i) => {
        toUnity("OnPlayerJoinedJS", JSON.stringify({ id:p.id, name:p.name, color:p.color, slot:i }));
        prev.delete(p.id);
      });
      // los que ya no están -> salieron
      prev.forEach(id => toUnity("OnPlayerLeftJS", JSON.stringify({ id })));
    });

    // inputs del celu -> a Unity
    socket.on("screen:input", (msg) => {
      const id = msg.id;
      if (msg.type === "axis")   toUnity("OnAxisJS",   JSON.stringify({ id, x:msg.x||0, y:msg.y||0 }));
      else if (msg.type === "button") toUnity("OnButtonJS", JSON.stringify({ id, button:msg.button, state:msg.state }));
      else if (msg.type === "sens")   toUnity("OnSensJS",   JSON.stringify({ id, value:msg.value||5 }));
    });

    // ===================================================================
    //  CARGA DEL JUEGO UNITY (lo genera Unity al exportar)
    // ===================================================================
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/ZombisWeb.loader.js";
    var config = {
      dataUrl: buildUrl + "/ZombisWeb.data",
      frameworkUrl: buildUrl + "/ZombisWeb.framework.js",
      codeUrl: buildUrl + "/ZombisWeb.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "My project (1)",
      productVersion: "0.1.0",
    };

    var canvas = document.querySelector("#unity-canvas");
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, (progress) => {
        document.getElementById("unity-progress").textContent = Math.round(progress*100) + "%";
      }).then((instance) => {
        unityInstance = instance;
        window.unityInstance = instance;
        document.getElementById("unity-loading").style.display = "none";
      }).catch((message) => { alert(message); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
