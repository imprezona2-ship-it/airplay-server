<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AirPlay · Zombi Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<style>
  :root{--bg:#0a0a12;--panel:#13131f;--ink:#f4f4ff;--dim:#6b6b8a;--accent:#6bff95;--p1:#4dd0ff;--p2:#ff4d6d;--blood:#b3122a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Bricolage Grotesque',sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,#1a1030 0%,transparent 60%),
               radial-gradient(900px 500px at 0% 110%,#06283a 0%,transparent 55%),var(--bg);
    color:var(--ink);min-height:100vh;overflow:hidden}
  .wrap{max-width:1280px;margin:0 auto;padding:32px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px}
  h1{font-size:clamp(24px,3.5vw,44px);font-weight:800;letter-spacing:-.03em}h1 span{color:var(--accent)}
  .tag{font-family:'Space Mono',monospace;color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.2em}

  .lobby{display:grid;grid-template-columns:1fr 1fr;gap:36px;flex:1;align-items:center}
  .join-card{background:var(--panel);border:1px solid #ffffff14;border-radius:28px;padding:44px;text-align:center}
  .join-card p{color:var(--dim);margin-bottom:8px;font-size:15px}
  .code{font-family:'Space Mono',monospace;font-size:clamp(44px,8vw,92px);font-weight:700;letter-spacing:.1em;color:var(--accent);line-height:1}
  .qr{margin-top:24px;display:inline-block;background:#fff;padding:14px;border-radius:18px}
  .qr img{display:block;width:170px;height:170px}
  .players h2{font-size:20px;font-weight:700;margin-bottom:14px}
  .pill{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:16px;padding:13px 20px;border:1px solid #ffffff10;animation:pop .35s ease;margin-bottom:12px}
  .pill .badge{margin-left:auto;font-family:'Space Mono',monospace;font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:2px 8px}
  .dot{width:18px;height:18px;border-radius:50%}
  .empty{color:var(--dim)}
  .note{color:var(--dim);font-size:13px;margin-bottom:14px;font-family:'Space Mono',monospace}
  .waitmsg{background:var(--panel);border:1px dashed #ffffff20;border-radius:16px;padding:18px;text-align:center;font-family:'Space Mono',monospace;color:var(--dim);font-size:14px}
  .waitmsg b{color:var(--p1)}

  .game{display:none;flex:1;flex-direction:column}
  .game.active{display:flex}
  .hud{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:12px;font-family:'Space Mono',monospace}
  .hud .block{display:flex;flex-direction:column;gap:6px}
  .hud .lbl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.15em}
  .hud .big{font-size:26px;font-weight:700}
  .lives{display:flex;gap:4px;font-size:22px}
  .wave{color:var(--accent)} .ammo1{color:var(--p1)} .ammo2{color:var(--p2)}
  canvas{flex:1;width:100%;display:block;border-radius:20px;
    background:linear-gradient(180deg,#0a0a14 0%,#14101c 55%,#1c0f14 100%);border:1px solid #ffffff10;cursor:none}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  @media(max-width:820px){.lobby{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Air<span>Play</span> · Zombi Arcade</h1><span class="tag">Cooperativo · 2 jugadores</span></header>

  <section class="lobby" id="lobby">
    <div class="join-card">
      <p>Entrá desde el celular y poné este código</p>
      <div class="code" id="code">····</div>
      <div class="qr" id="qrBox"></div>
    </div>
    <div class="players">
      <h2>Jugadores</h2>
      <div class="note">Cooperativo · 1 o más jugadores · comparten vida y puntaje</div>
      <div id="playerList"><div class="empty">Esperando…</div></div>
      <div class="waitmsg" id="waitmsg" style="display:none"></div>
    </div>
  </section>

  <section class="game" id="game">
    <div class="hud">
      <div class="block"><span class="lbl">Vida del equipo</span><span class="lives" id="lives"></span></div>
      <div class="block" style="align-items:center"><span class="lbl wave">Oleada</span><span class="big wave" id="wave">1</span></div>
      <div class="block" style="align-items:center"><span class="lbl">Puntaje</span><span class="big" id="score">0</span></div>
      <div class="block" style="align-items:flex-end"><span class="lbl ammo1">P1 balas</span><span class="big ammo1" id="ammo1">10</span></div>
      <div class="block" style="align-items:flex-end"><span class="lbl ammo2">P2 balas</span><span class="big ammo2" id="ammo2">10</span></div>
    </div>
    <canvas id="cv"></canvas>
  </section>
</div>

<script>
  const socket = io();
  socket.emit("screen:create");
  socket.on("screen:created", ({ code, qr, joinUrl }) => {
    document.getElementById("code").textContent = code;
    document.getElementById("qrBox").innerHTML = `<img src="${qr}" alt="QR"/>`;
    console.log("Control:", joinUrl);
  });

  let playersMeta = {}, order = [], menuKind = null, pendingSens = {};
  socket.on("screen:players", (players) => {
    playersMeta = {}; order = [];
    players.forEach(p => { playersMeta[p.id] = p; order.push(p.id); });
    const list = document.getElementById("playerList");
    list.innerHTML = players.length
      ? players.map((p,i)=>`<div class="pill"><span class="dot" style="background:${p.color}"></span>${p.name}${i===0?'<span class="badge">CONTROL</span>':''}</div>`).join("")
      : '<div class="empty">Esperando…</div>';

    const wm = document.getElementById("waitmsg");
    if (!running && !inMenu){
      if (players.length >= 1){
        wm.style.display="block";
        wm.innerHTML = `Listo (${players.length} ${players.length===1?'jugador':'jugadores'}). <b>${players[0].name}</b> aprietá <b>✕</b> en tu celu para empezar.`;
        sendMenuToP1("start");
      } else {
        wm.style.display = "none";
        clearP1Menu();
      }
    }
  });

  // mandar prompt de menú SOLO al primer jugador
  function sendMenuToP1(kind){
    const p1 = order[0]; if(!p1) return;
    inMenu = true; menuKind = kind;
    socket.emit("screen:message", { to:p1, data:{ type:"menu", kind } });
    // los demás no controlan menú
    socket.emit("screen:message", { data:{ type:"banner", text: kind==="start"?"Esperando a P1…":"Fin · espera a P1" }});
  }
  function clearP1Menu(){
    const p1 = order[0]; if(!p1) return;
    socket.emit("screen:message", { to:p1, data:{ type:"menu", kind:"none" } });
  }

  /* ===================== ZOMBI ARCADE ===================== */
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  let running=false, inMenu=false, W=0, H=0, HORIZON=0;
  const P = {};
  let zombies=[], bullets=[], particles=[], shakeT=0;
  let cityCanvas=null, cityW=0, cityH=0;
  let teamLives=5, score=0, wave=1, spawnTimer=0, toSpawn=0, alive=0, betweenWaves=0, gameover=false;
  const MAG=10, RELOAD_FRAMES=45;

  function resize(){ W=cv.width=cv.clientWidth; H=cv.height=cv.clientHeight; HORIZON=H*0.30; cityCanvas=null; }

  function startGame(){
    document.getElementById("lobby").style.display="none";
    document.getElementById("game").classList.add("active");
    resize(); window.removeEventListener("resize", resize); window.addEventListener("resize", resize);

    Object.keys(P).forEach(k=>delete P[k]);
    order.forEach((id,i)=>{
      P[id]={ id, x:W*(order.length===1?0.5:(i===0?0.35:0.65)), y:H*0.6, ammo:MAG, reloading:0,
              color:playersMeta[id].color, name:playersMeta[id].name, slot:i,
              ax:0, ay:0, firing:false, fireCd:0, flash:0, sens: pendingSens[id]||5 };
    });

    socket.emit("screen:message", { data:{ type:"config", buttons:["cross","square"],
      banner:"Stick = mira · ✕ disparar · □ recargar" }});

    teamLives=5; score=0; wave=1; gameover=false; inMenu=false; menuKind=null;
    zombies=[]; bullets=[]; particles=[];
    for(const id in P){ P[id].firing=false; P[id].ax=0; P[id].ay=0; }
    startWave();
    running=true; requestAnimationFrame(loop);
  }

  function startWave(){
    const np = Math.max(1, order.length);
    // más zombis por oleada y según jugadores (con más gente, más enemigos pero repartidos)
    toSpawn = Math.round((8 + wave*3) * (1 + (np-1)*0.6));
    alive = toSpawn;
    spawnTimer = 20;
    betweenWaves = 0;
  }

  socket.on("screen:input", ({ id, type, x, y, button, state, value })=>{
    // --- control de MENÚ: solo el primer jugador ---
    if (inMenu && id===order[0] && type==="button" && state==="down"){
      if (menuKind==="start" && button==="cross"){ inMenu=false; startGame(); return; }
      if (menuKind==="end"){
        if (button==="cross"){ inMenu=false; startGame(); return; }      // jugar de nuevo
        if (button==="circle"){ inMenu=false; backToLobby(); return; }    // salir
      }
      return;
    }
    // --- sensibilidad: puede llegar antes o durante el juego ---
    if (type==="sens"){
      if (P[id]) P[id].sens = value;
      else pendingSens[id] = value;   // todavía no empezó: lo guardamos
      return;
    }
    // --- juego ---
    const p = P[id]; if(!p || !running) return;
    if (type==="axis"){
      p.ax = x; p.ay = y;
    }
    if (type==="button"){
      if (button==="cross") p.firing = (state==="down");
      if (button==="square" && state==="down") reload(p);
    }
  });

  // espejo local de qué menú está activo (la pantalla lo decide)
  function setMenu(kind){ menuKind=kind; }

  function reload(p){ if(p.reloading>0 || p.ammo===MAG) return; p.reloading=RELOAD_FRAMES; }

  function shoot(p){
    if (p.reloading>0) return;
    if (p.ammo<=0){ reload(p); return; }
    p.ammo--;
    p.flash = 5;                 // destello en la mira
    bullets.push({x:p.x, y:p.y, life:6, color:p.color});  // rayo desde la mira
    shakeT=Math.max(shakeT,2);
    let hitZ=null, bestZ=-1;
    const PAD = 14;   // margen de perdón alrededor del zombi
    for (const z of zombies){
      if(z.dead) continue;
      const s=zScale(z), zw=38*s, zh=80*s, zx=z.x, zy=groundY(z)-zh;
      if (p.x>=zx-zw/2-PAD && p.x<=zx+zw/2+PAD && p.y>=zy-PAD && p.y<=zy+zh+PAD){
        if (z.prog>bestZ){ bestZ=z.prog; hitZ=z; }
      }
    }
    if (hitZ){
      const zh=80*zScale(hitZ), zy=groundY(hitZ)-zh;
      const headshot = (p.y <= zy + zh*0.32);
      hitZ.hp -= headshot?100:34;
      spawnBlood(p.x,p.y, headshot?26:14);
      if (hitZ.hp<=0) killZombie(hitZ, headshot);
    }
  }

  function killZombie(z, headshot){
    z.dead=true; alive=Math.max(0,alive-1);
    const base = z.type==="rapido"?180 : z.type==="medio"?130 : 100;
    score += headshot ? Math.round(base*1.5) : base;
    spawnBlood(z.x, groundY(z)-40*zScale(z), 30);
  }
  function spawnBlood(x,y,n){ for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.7)*7,life:22}); }

  function zScale(z){ return 0.35 + z.prog*1.05; }
  function groundY(z){ return HORIZON + (H-HORIZON)*z.prog; }

  // tipos de zombi: lento (mayoría), medio, rápido (pocos)
  const ZTYPES = {
    lento:  { speedBase:0.00018, color:"#3c5a3a", head:"#6f8f5a", hp:34, sizeMul:1.15, prob:0.60 },
    medio:  { speedBase:0.00032, color:"#5a6a2a", head:"#8fa05a", hp:30, sizeMul:1.0,  prob:0.28 },
    rapido: { speedBase:0.00052, color:"#6a3a2a", head:"#b06a4a", hp:22, sizeMul:0.85, prob:0.12 },
  };
  function pickType(){
    // a mayor oleada, sube un poco la chance de medios/rápidos (pero los lentos siguen siendo mayoría)
    const boost = Math.min(0.18, wave*0.015);
    const pRapido = ZTYPES.rapido.prob + boost*0.6;
    const pMedio  = ZTYPES.medio.prob + boost*0.4;
    const r = Math.random();
    if (r < pRapido) return "rapido";
    if (r < pRapido + pMedio) return "medio";
    return "lento";
  }
  function spawnZombie(){
    const t = pickType();
    const cfg = ZTYPES[t];
    const speed = cfg.speedBase + wave*0.00002 + Math.random()*0.00008;
    zombies.push({ x: W*(0.10+Math.random()*0.80), prog:0, hp:cfg.hp, speed, dead:false,
      wob:Math.random()*6, type:t, color:cfg.color, head:cfg.head, sizeMul:cfg.sizeMul });
  }

  function setHUD(){
    document.getElementById("lives").textContent = "❤".repeat(Math.max(0,teamLives)) + "♡".repeat(Math.max(0,5-teamLives));
    document.getElementById("wave").textContent = wave;
    document.getElementById("score").textContent = score;
    const [a,b]=order;
    document.getElementById("ammo1").textContent = P[a]? (P[a].reloading>0?"…":P[a].ammo) : "-";
    document.getElementById("ammo2").textContent = P[b]? (P[b].reloading>0?"…":P[b].ammo) : "-";
  }

  function drawZombie(z){
    const mul = z.sizeMul||1;
    const s=zScale(z), gx=z.x, gy=groundY(z), w=38*s*mul, h=80*s*mul;
    // los rápidos se mueven más nerviosos
    const wobSpeed = z.type==="rapido"?0.012 : z.type==="medio"?0.007 : 0.005;
    const sway=Math.sin(Date.now()*wobSpeed+z.wob)*3*s;
    const body = z.color||"#3c5a3a";
    const head = z.head||"#6f8f5a";
    ctx.save();
    ctx.fillStyle="rgba(0,0,0,0.35)"; ctx.beginPath(); ctx.ellipse(gx,gy,w*0.6,7*s,0,0,7); ctx.fill();
    ctx.fillStyle=body; ctx.strokeStyle="#223322"; ctx.lineWidth=2;
    roundRect(gx-w/2+sway, gy-h, w, h*0.66, 8*s); ctx.fill(); ctx.stroke();
    ctx.fillStyle=head; ctx.beginPath(); ctx.arc(gx+sway, gy-h+h*0.16, w*0.42,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle="#ff3b3b"; ctx.shadowColor="#ff3b3b"; ctx.shadowBlur=8*s;
    ctx.beginPath(); ctx.arc(gx+sway-w*0.15,gy-h+h*0.14,2.4*s,0,7); ctx.arc(gx+sway+w*0.15,gy-h+h*0.14,2.4*s,0,7); ctx.fill(); ctx.shadowBlur=0;
    ctx.strokeStyle=body; ctx.lineWidth=6*s; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(gx-w/2+sway,gy-h*0.55); ctx.lineTo(gx-w*0.75+sway,gy-h*0.4);
    ctx.moveTo(gx+w/2+sway,gy-h*0.55); ctx.lineTo(gx+w*0.75+sway,gy-h*0.4); ctx.stroke();
    ctx.restore();
  }
  function drawCrosshair(p){
    ctx.save();
    if(p.flash>0){ // destello al disparar
      ctx.fillStyle="#fff"; ctx.globalAlpha=p.flash/5;
      ctx.beginPath(); ctx.arc(p.x,p.y,22,0,7); ctx.fill(); ctx.globalAlpha=1;
    }
    // cuando el aim assist engancha un zombi, la mira se agranda y marca el blanco
    const locked = p.aimLock;
    const r = locked ? 20 : 16;
    if(locked){
      ctx.strokeStyle="#ff5252"; ctx.lineWidth=3; ctx.shadowColor="#ff5252"; ctx.shadowBlur=14;
      ctx.beginPath(); ctx.arc(p.x,p.y,r+6,0,7); ctx.stroke();   // anillo rojo de "target"
    }
    ctx.strokeStyle=locked?"#ff7070":p.color; ctx.lineWidth=2.5; ctx.shadowColor=locked?"#ff5252":p.color; ctx.shadowBlur=10;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.x-24,p.y); ctx.lineTo(p.x-6,p.y); ctx.moveTo(p.x+6,p.y); ctx.lineTo(p.x+24,p.y);
    ctx.moveTo(p.x,p.y-24); ctx.lineTo(p.x,p.y-6); ctx.moveTo(p.x,p.y+6); ctx.lineTo(p.x,p.y+24);
    ctx.stroke(); ctx.shadowBlur=0; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,7); ctx.fill();
    ctx.font="11px 'Space Mono',monospace"; ctx.textAlign="center"; ctx.fillText(p.name, p.x, p.y-26);
    if(p.reloading>0){
      const prog = 1 - p.reloading/RELOAD_FRAMES;
      ctx.fillStyle="#ffd166"; ctx.font="bold 12px 'Space Mono',monospace";
      ctx.fillText("RECARGANDO", p.x, p.y+34);
      // barrita de progreso
      ctx.fillStyle="#ffffff30"; ctx.fillRect(p.x-26, p.y+40, 52, 5);
      ctx.fillStyle="#ffd166"; ctx.fillRect(p.x-26, p.y+40, 52*prog, 5);
    }
    ctx.restore();
  }
  function roundRect(x,y,w,h,r){ ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  /* ---------- FONDO DE CIUDAD (generado una vez en canvas offscreen) ---------- */
  const NEONS=[
    {txt:"ZOMBI BURGER", color:"#6bff95", x:0.16},
    {txt:"MOTEL",        color:"#ff4d6d", x:0.55},
    {txt:"BRAIN FREEZE", color:"#4dd0ff", x:0.85},
  ];
  function buildCity(){
    cityW=W; cityH=HORIZON+60;
    cityCanvas=document.createElement("canvas");
    cityCanvas.width=cityW; cityCanvas.height=cityH;
    const c=cityCanvas.getContext("2d");
    // cielo nocturno
    const sky=c.createLinearGradient(0,0,0,cityH);
    sky.addColorStop(0,"#0c0a1e"); sky.addColorStop(.6,"#171033"); sky.addColorStop(1,"#241445");
    c.fillStyle=sky; c.fillRect(0,0,cityW,cityH);
    // luna
    c.save(); c.shadowColor="#cde7ff"; c.shadowBlur=40;
    c.fillStyle="#e8f1ff"; c.beginPath(); c.arc(cityW*0.5, cityH*0.28, 34, 0, 7); c.fill();
    c.restore();
    // estrellas
    c.fillStyle="#ffffff"; for(let i=0;i<60;i++){ c.globalAlpha=Math.random()*0.7+0.2;
      c.fillRect(Math.random()*cityW, Math.random()*cityH*0.7, 2,2); } c.globalAlpha=1;
    // edificios (varias capas para profundidad)
    function layer(base, hMin, hMax, color, win){
      let x=0;
      while(x<cityW){
        const bw=40+Math.random()*70, bh=hMin+Math.random()*(hMax-hMin);
        const by=HORIZON-bh+base;
        c.fillStyle=color; c.fillRect(x,by,bw,bh+60);
        if(win){ for(let wy=by+8; wy<by+bh-6; wy+=14){ for(let wx=x+6; wx<x+bw-6; wx+=12){
          if(Math.random()>0.45){ c.fillStyle=Math.random()>0.5?"#ffd16699":"#4dd0ff66"; c.fillRect(wx,wy,6,8);} } } }
        x+=bw+4;
      }
    }
    layer(20, 70, 130, "#1a1230", false);
    layer(10, 90, 170, "#221842", true);
    layer(0, 60, 110, "#2c1e52", true);
    // marcos de neón de los locales
    NEONS.forEach(n=>{
      c.save();
      c.font="800 26px 'Bricolage Grotesque',sans-serif"; c.textAlign="center";
      c.shadowColor=n.color; c.shadowBlur=18; c.fillStyle=n.color;
      c.fillText(n.txt, cityW*n.x, HORIZON-28);
      c.strokeStyle=n.color; c.lineWidth=2; c.globalAlpha=.6;
      const tw=c.measureText(n.txt).width;
      roundRectC(c, cityW*n.x-tw/2-12, HORIZON-52, tw+24, 36, 8); c.stroke();
      c.restore();
    });
  }
  function roundRectC(c,x,y,w,h,r){ c.beginPath();
    c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

  function drawBackground(){
    if(!cityCanvas || cityW!==W) buildCity();
    ctx.drawImage(cityCanvas, 0, 0);
    // calle en perspectiva
    const g=ctx.createLinearGradient(0,HORIZON,0,H);
    g.addColorStop(0,"#1a1426"); g.addColorStop(1,"#0d0a14");
    ctx.fillStyle=g; ctx.fillRect(0,HORIZON,W,H-HORIZON);
    // líneas de la calle hacia el horizonte
    ctx.strokeStyle="#ffffff10"; ctx.lineWidth=2;
    const cx=W/2;
    for(let i=-4;i<=4;i++){
      ctx.beginPath(); ctx.moveTo(cx+i*40, HORIZON); ctx.lineTo(cx+i*240, H); ctx.stroke();
    }
    // neblina sobre el piso
    const fog=ctx.createLinearGradient(0,HORIZON,0,HORIZON+90);
    fog.addColorStop(0,"#3a2a4acc"); fog.addColorStop(1,"transparent");
    ctx.fillStyle=fog; ctx.fillRect(0,HORIZON,W,90);
  }

  /* ---------- PISTOLA / ARMA abajo ---------- */
  function drawGun(){
    const gx=W/2, gy=H;
    ctx.save();
    // cañón
    ctx.fillStyle="#1c1c24"; ctx.strokeStyle="#000"; ctx.lineWidth=2;
    roundRect(gx-26, gy-130, 52, 140, 12); ctx.fill(); ctx.stroke();
    // boca del cañón
    ctx.fillStyle="#33333f"; ctx.beginPath(); ctx.ellipse(gx, gy-130, 26, 10, 0,0,7); ctx.fill();
    ctx.fillStyle="#0a0a0f"; ctx.beginPath(); ctx.ellipse(gx, gy-130, 15, 6, 0,0,7); ctx.fill();
    // reflejo
    ctx.fillStyle="#ffffff14"; roundRect(gx-20, gy-124, 8, 120, 4); ctx.fill();
    ctx.restore();
  }

  function loop(){
    if(!running) return;
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if(shakeT>0){ ctx.translate((Math.random()-.5)*shakeT*2,(Math.random()-.5)*shakeT*2); shakeT*=0.85; if(shakeT<0.4)shakeT=0; }

    drawBackground();

    if(!gameover && betweenWaves===0 && toSpawn>0){
      const np = Math.max(1, order.length);
      const onScreen = zombies.filter(z=>!z.dead).length;
      // queremos varios en pantalla a la vez (más con más jugadores)
      const maxOnScreen = 4 + Math.floor(wave/2) + (np-1)*2;
      spawnTimer--;
      if(spawnTimer<=0 && onScreen < maxOnScreen){
        spawnZombie(); toSpawn--;
        // aparición más rápida a medida que sube la oleada, pero con piso
        spawnTimer = Math.max(28, 70 - wave*3);
      } else if(spawnTimer<=0){
        spawnTimer = 12; // reintenta pronto cuando se libere espacio
      }
    }

    zombies.sort((a,b)=>a.prog-b.prog);
    zombies = zombies.filter(z=>{
      if(z.dead) return false;
      z.prog += z.speed*16;
      if(z.prog>=1){ teamLives--; shakeT=12; spawnBlood(z.x,H-30,24); alive=Math.max(0,alive-1);
        if(teamLives<=0){ endGame(); } return false; }
      drawZombie(z); return true;
    });

    // --- movimiento de mira (velocidad fija, sensibilidad por jugador) ---
    const DEAD = 0.10;
    const ASSIST_RADIUS = 110;   // distancia a la que la mira empieza a "pegarse"
    const ASSIST_PULL = 0.18;    // fuerza del imán (0 = nada, 1 = se pega del todo)
    for(const id in P){
      const p=P[id];
      const SENS = 4 + (p.sens||5)*2.2;
      let ax = Math.abs(p.ax)>DEAD ? p.ax : 0;
      let ay = Math.abs(p.ay)>DEAD ? p.ay : 0;
      p.x = Math.max(0, Math.min(W, p.x + ax*SENS));
      p.y = Math.max(HORIZON, Math.min(H, p.y + ay*SENS));

      // AIM ASSIST: si hay un zombi cerca de la mira, la atrae suavemente
      let near=null, nd=ASSIST_RADIUS;
      for(const z of zombies){
        if(z.dead) continue;
        const cx=z.x, cy=groundY(z)-80*zScale(z)*0.5; // centro del cuerpo
        const d=Math.hypot(cx-p.x, cy-p.y);
        if(d<nd){ nd=d; near={x:cx,y:cy,d}; }
      }
      if(near){
        // cuanto más cerca, más fuerte el imán (suave, no instantáneo)
        const strength = ASSIST_PULL * (1 - near.d/ASSIST_RADIUS);
        p.x += (near.x - p.x) * strength;
        p.y += (near.y - p.y) * strength;
        p.aimLock = true;
      } else p.aimLock = false;

      // recarga (manual con □, o automática al quedarse sin balas)
      if(p.ammo<=0 && p.reloading<=0) p.reloading=RELOAD_FRAMES;
      if(p.reloading>0){ p.reloading--; if(p.reloading===0) p.ammo=MAG; }
      // disparo automático con cadencia
      if(p.fireCd>0) p.fireCd--;
      if(p.firing && p.fireCd<=0 && p.reloading<=0 && p.ammo>0){ shoot(p); p.fireCd=9; }
      if(p.flash>0) p.flash--;
    }

    bullets = bullets.filter(b=>{ b.life--;
      // rayo desde la boca del cañón hacia la mira
      ctx.strokeStyle=b.color||"#fff"; ctx.globalAlpha=b.life/6; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(W/2, H-130); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(b.x,b.y,4,0,7); ctx.fill(); ctx.globalAlpha=1;
      return b.life>0; });
    particles = particles.filter(pt=>{ pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.5; pt.life--;
      ctx.globalAlpha=pt.life/22; ctx.fillStyle="#b3122a"; ctx.fillRect(pt.x,pt.y,4,4); ctx.globalAlpha=1; return pt.life>0; });

    drawGun();
    for(const id in P) drawCrosshair(P[id]);
    ctx.restore();

    if(!gameover && toSpawn===0 && alive<=0 && betweenWaves===0) betweenWaves=120;
    if(betweenWaves>0){
      betweenWaves--;
      ctx.fillStyle="rgba(7,7,16,0.55)"; ctx.fillRect(0,0,W,H); ctx.textAlign="center";
      ctx.fillStyle="#6bff95"; ctx.font="800 40px 'Bricolage Grotesque',sans-serif";
      ctx.fillText("¡Oleada "+wave+" superada!", W/2, H/2-10);
      ctx.fillStyle="#fff"; ctx.font="20px 'Space Mono',monospace";
      ctx.fillText("Preparate para la siguiente…", W/2, H/2+30);
      if(betweenWaves===0){ wave++; startWave(); }
    }
    setHUD();
    requestAnimationFrame(loop);
  }

  function endGame(){
    gameover=true; running=false;
    drawEndScreen();
    setMenu("end");
    sendMenuToP1("end");
  }
  function drawEndScreen(){
    ctx.fillStyle="rgba(20,4,8,0.9)"; ctx.fillRect(0,0,W,H); ctx.textAlign="center";
    ctx.fillStyle="#ff4d6d"; ctx.shadowColor="#ff4d6d"; ctx.shadowBlur=30;
    ctx.font="800 64px 'Bricolage Grotesque',sans-serif"; ctx.fillText("GAME OVER", W/2, H/2-60);
    ctx.shadowBlur=0; ctx.fillStyle="#fff"; ctx.font="800 28px 'Bricolage Grotesque',sans-serif";
    ctx.fillText("Oleada "+wave+" · "+score+" pts", W/2, H/2-14);
    // botones en pantalla (informativos; se accionan desde el celu de P1)
    ctx.font="700 22px 'Bricolage Grotesque',sans-serif";
    ctx.fillStyle="#4dd0ff"; ctx.fillText("✕  Jugar de nuevo", W/2, H/2+40);
    ctx.fillStyle="#ff4d6d"; ctx.fillText("○  Salir al inicio", W/2, H/2+78);
    ctx.fillStyle="#6b6b8a"; ctx.font="14px 'Space Mono',monospace";
    ctx.fillText("(decide "+(playersMeta[order[0]]?playersMeta[order[0]].name:"P1")+" desde su celu)", W/2, H/2+112);
  }

  function backToLobby(){
    running=false; gameover=false;
    document.getElementById("game").classList.remove("active");
    document.getElementById("lobby").style.display="grid";
    // si siguen los 2, ofrecer empezar de nuevo
    if(order.length>=1){ sendMenuToP1("start");
      const wm=document.getElementById("waitmsg"); wm.style.display="block";
      wm.innerHTML=`Listo. <b>${playersMeta[order[0]].name}</b> aprietá <b>✕</b> para empezar.`;
    }
  }
</script>
